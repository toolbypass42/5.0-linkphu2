<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKER LINK - PINK & BLACK</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    min-height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  /* Hiệu ứng nền phát sáng hồng */
  body::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, #ff1493 0%, transparent 70%);
    top: -200px;
    left: -200px;
    opacity: 0.4;
    filter: blur(60px);
    animation: float 6s ease-in-out infinite;
  }

  body::after {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, #ff69b4 0%, transparent 70%);
    bottom: -200px;
    right: -200px;
    opacity: 0.4;
    filter: blur(60px);
    animation: float 8s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, 30px); }
  }

  .container {
    position: relative;
    z-index: 2;
    background: rgba(10, 10, 10, 0.85);
    border: 2px solid #ff1493;
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 
      0 0 20px #ff1493,
      0 0 40px rgba(255, 20, 147, 0.5),
      inset 0 0 20px rgba(255, 20, 147, 0.1);
    backdrop-filter: blur(10px);
    animation: borderPulse 2s ease-in-out infinite;
  }

  @keyframes borderPulse {
    0%, 100% { 
      box-shadow: 0 0 20px #ff1493, 0 0 40px rgba(255, 20, 147, 0.5), inset 0 0 20px rgba(255, 20, 147, 0.1);
    }
    50% { 
      box-shadow: 0 0 30px #ff1493, 0 0 60px rgba(255, 20, 147, 0.8), inset 0 0 30px rgba(255, 20, 147, 0.2);
    }
  }

  .logo {
    font-size: 50px;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 15px #ff1493);
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  h1 {
    color: #ff1493;
    font-size: 28px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493;
  }

  .subtitle {
    color: #ff69b4;
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 30px;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .link-box {
    margin-bottom: 18px;
    text-align: left;
  }

  .link-label {
    color: #ff69b4;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-left: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .link-label::before {
    content: '';
    width: 6px;
    height: 6px;
    background: #ff1493;
    border-radius: 50%;
    box-shadow: 0 0 8px #ff1493;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  a.link-btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    background: linear-gradient(135deg, #1a0010 0%, #2d0018 100%);
    border: 2px solid #ff1493;
    border-radius: 12px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
    word-break: break-all;
  }

  a.link-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 20, 147, 0.4), transparent);
    transition: left 0.5s ease;
  }

  a.link-btn:hover::before {
    left: 100%;
  }

  a.link-btn:hover {
    background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
    color: #000;
    box-shadow: 0 0 30px #ff1493, 0 0 60px rgba(255, 20, 147, 0.6);
    transform: translateY(-3px);
  }

  a.link-btn:active {
    transform: translateY(0);
  }

  .main-link {
    border-color: #ff1493;
    background: linear-gradient(135deg, #3d0020 0%, #ff1493 100%);
    color: #fff;
    font-size: 15px;
    text-shadow: 0 0 5px rgba(0,0,0,0.5);
  }

  .main-link:hover {
    color: #000;
  }

  .backup-link {
    border-color: #ff69b4;
  }

  .key-link {
    border-color: #ff69b4;
    background: linear-gradient(135deg, #1a0010 0%, #3d0020 100%);
  }

  .footer {
    margin-top: 25px;
    color: #ff69b4;
    font-size: 11px;
    letter-spacing: 2px;
    opacity: 0.6;
    text-transform: uppercase;
  }

  .footer::before,
  .footer::after {
    content: '◆';
    margin: 0 8px;
    color: #ff1493;
  }

  /* Scanline effect */
  .scanline {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff1493, transparent);
    opacity: 0.6;
    animation: scan 4s linear infinite;
    z-index: 1;
    pointer-events: none;
  }

  @keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
  }
</style>
</head>
<body>
  <div class="scanline"></div>
  
  <div class="container">
    <div class="logo">💀</div>
    <h1>HACKER LINK</h1>
    <p class="subtitle">/// ACCESS POINT ///</p>

    <div class="link-box">
      <div class="link-label">Link Chính</div>
      <a href="https://phienchoso.com/9b24774bbce946e42b1c.tk" target="_blank" rel="noopener" class="link-btn main-link">
        🔥 TRUY CẬP NGAY 🔥
      </a>
    </div>

    <div class="link-box">
      <div class="link-label">Link Dự Phòng</div>
      <a href="https://sitetop.one/dOKXt8" target="_blank" rel="noopener" class="link-btn backup-link">
        🛡️ LINK BACKUP 🛡️
      </a>
    </div>

    <div class="link-box">
      <div class="link-label">Lấy Key</div>
      <a href="https://traffictop.net/qqJWpE" target="_blank" rel="noopener" class="link-btn key-link">
        🔑 GET KEY 🔑
      </a>
    </div>

    <div class="footer">SECURE ACCESS</div>
  </div>
</body>
</html>
