<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKER ACCESS PANEL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Courier New', monospace;
    background: #000;
    color: #ff2e88;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Hiệu ứng nền ma trận */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        0deg,
        rgba(255, 46, 136, 0.06) 0px,
        rgba(255, 46, 136, 0.06) 1px,
        transparent 1px,
        transparent 3px
      );
    pointer-events: none;
    z-index: 1;
  }

  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 0%, #000 90%);
    pointer-events: none;
    z-index: 2;
  }

  .panel {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 480px;
    padding: 40px 30px;
    background: rgba(10, 0, 8, 0.9);
    border: 2px solid #ff2e88;
    border-radius: 12px;
    box-shadow:
      0 0 15px #ff2e88,
      0 0 40px rgba(255, 46, 136, 0.5),
      inset 0 0 20px rgba(255, 46, 136, 0.15);
    text-align: center;
    margin: 20px;
    animation: glow 2.5s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { box-shadow: 0 0 15px #ff2e88, 0 0 40px rgba(255,46,136,0.5), inset 0 0 20px rgba(255,46,136,0.15); }
    to   { box-shadow: 0 0 25px #ff2e88, 0 0 70px rgba(255,46,136,0.8), inset 0 0 30px rgba(255,46,136,0.3); }
  }

  .logo {
    font-size: 26px;
    letter-spacing: 4px;
    font-weight: bold;
    text-shadow: 0 0 10px #ff2e88, 0 0 20px #ff2e88;
    margin-bottom: 5px;
    animation: flicker 3s infinite;
  }

  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.4; }
  }

  .subtitle {
    font-size: 12px;
    color: #ff7ab8;
    letter-spacing: 2px;
    margin-bottom: 30px;
    opacity: 0.8;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #ff2e88, transparent);
    margin: 20px 0;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 12px 0;
    background: linear-gradient(90deg, #1a0010, #2a0018);
    color: #ff2e88;
    border: 1.5px solid #ff2e88;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-decoration: none;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 8px rgba(255, 46, 136, 0.4);
  }

  .btn:hover {
    background: #ff2e88;
    color: #000;
    box-shadow: 0 0 25px #ff2e88, 0 0 50px rgba(255, 46, 136, 0.7);
    transform: translateY(-2px);
  }

  .btn:active {
    transform: translateY(0);
    box-shadow: 0 0 15px #ff2e88;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
  }

  .btn:hover::before {
    left: 100%;
  }

  .footer {
    margin-top: 25px;
    font-size: 10px;
    color: #ff2e88;
    opacity: 0.5;
    letter-spacing: 2px;
  }

  .status {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #ff2e88;
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 8px #ff2e88;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
</style>
</head>
<body>

  <div class="panel">
    <div class="logo">HACKER ACCESS</div>
    <div class="subtitle">[ SYSTEM ONLINE ]</div>

    <div class="divider"></div>

    </a>

    <a href="https://phienchoso.com/68b38364534b9ff2866a.tk" class="btn" target="_blank" rel="noopener">
      ► BOT TELEGRAM
    </a>

    <div class="divider"></div>

    <div class="footer">
      <span class="status"></span> SECURE CONNECTION • v1.0
    </div>
  </div>

</body>
</html>
